<div class="flex gap-4 mb-6">
  <app-summary-card label="Total this month" [value]="format(totalExpenses())" />
  <app-summary-card label="Recurring expenses" [value]="format(totalRecurring())" />
</div>

<table class="w-full text-sm text-left">
  <thead>
    <tr class="border-b border-gray-200 text-gray-500 uppercase text-xs tracking-wide">
      <th class="pb-3 font-medium">Date</th>
      <th class="pb-3 font-medium">Merchant</th>
      <th class="pb-3 font-medium">Category</th>
      <th class="pb-3 font-medium text-right">Amount</th>
    </tr>
  </thead>
  <tbody>
    @for (expense of expenses(); track expense.id) {
      <tr class="border-b border-gray-100 hover:bg-gray-50">
        <td class="py-3 text-gray-500">{{ expense.date | date:'mediumDate' }}</td>
        <td class="py-3 text-gray-800 font-medium">{{ expense.merchant }}</td>
        <td class="py-3">
          <span class="px-2 py-1 rounded-full bg-gray-100 text-gray-600 text-xs">{{ expense.category }}</span>
        </td>
        <td class="py-3 text-gray-800 font-medium text-right">
          {{ expense.amount | currency:expense.currency }}
        </td>
      </tr>
    }
  </tbody>
</table>
