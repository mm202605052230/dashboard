<a
  [routerLink]="route()"
  routerLinkActive="bg-gray-700 text-white"
  class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-400 hover:bg-gray-700 hover:text-white transition-colors duration-150 cursor-pointer"
  ariaCurrentWhenActive="page"
>
  <span class="w-5 h-5 flex-shrink-0" aria-hidden="true">
    <ng-content />
  </span>
  <span class="text-sm font-medium">{{ label() }}</span>
</a>
