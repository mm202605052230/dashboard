<div class="flex items-center gap-3">
  <div class="flex items-center gap-2">
    <label for="date-from" class="text-xs text-gray-500 font-medium uppercase tracking-wide">From</label>
    <input
      id="date-from"
      type="date"
      [value]="startDate()"
      (change)="startDateChange.emit($any($event.target).value)"
      class="text-sm border border-gray-200 rounded-lg px-3 py-1.5 text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-300"
    />
  </div>
  <div class="flex items-center gap-2">
    <label for="date-to" class="text-xs text-gray-500 font-medium uppercase tracking-wide">To</label>
    <input
      id="date-to"
      type="date"
      [value]="endDate()"
      (change)="endDateChange.emit($any($event.target).value)"
      class="text-sm border border-gray-200 rounded-lg px-3 py-1.5 text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-300"
    />
  </div>
  @if (startDate() || endDate()) {
    <button
      (click)="clear()"
      aria-label="Clear date filter"
      class="text-xs text-indigo-500 hover:text-indigo-700 font-medium ml-1"
    >Clear</button>
  }
  <span class="ml-auto text-xs text-gray-400" aria-live="polite">{{ filtered() }} of {{ total() }} entries</span>
</div>
