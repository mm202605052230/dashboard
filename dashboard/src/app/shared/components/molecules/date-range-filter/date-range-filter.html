<div class="flex items-center gap-3">
  <div class="flex items-center gap-2">
    <label class="text-xs text-gray-500 font-medium uppercase tracking-wide">From</label>
    <input
      type="date"
      [ngModel]="startDate()"
      (ngModelChange)="startDateChange.emit($event)"
      class="text-sm border border-gray-200 rounded-lg px-3 py-1.5 text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-300"
    />
  </div>
  <div class="flex items-center gap-2">
    <label class="text-xs text-gray-500 font-medium uppercase tracking-wide">To</label>
    <input
      type="date"
      [ngModel]="endDate()"
      (ngModelChange)="endDateChange.emit($event)"
      class="text-sm border border-gray-200 rounded-lg px-3 py-1.5 text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-300"
    />
  </div>
  @if (startDate() || endDate()) {
    <button
      (click)="clear()"
      class="text-xs text-indigo-500 hover:text-indigo-700 font-medium ml-1"
    >Clear</button>
  }
  <span class="ml-auto text-xs text-gray-400">{{ filtered() }} of {{ total() }} entries</span>
</div>
